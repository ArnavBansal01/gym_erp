<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#D93E05" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDEDED" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141414" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Badge Background -->
  <rect width="512" height="512" rx="112" fill="url(#auraBg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" />

  <!-- Diagonal Athletic Barbell (Rotated 45 degrees) -->
  <g transform="rotate(-45 256 256)" filter="url(#shadow)">
    <!-- Center Bar -->
    <rect x="130" y="234" width="252" height="44" rx="12" fill="url(#metalGrad)" />
    
    <!-- Grip Texture Rings -->
    <rect x="226" y="228" width="60" height="56" rx="8" fill="#141414" />
    <line x1="246" y1="230" x2="246" y2="282" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="266" y1="230" x2="266" y2="282" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Left Collars & Plates -->
    <rect x="120" y="210" width="22" height="92" rx="8" fill="#FFFFFF" />
    <rect x="76" y="130" width="38" height="252" rx="14" fill="#FFFFFF" />
    <rect x="32" y="166" width="34" height="180" rx="12" fill="#EDEDED" />

    <!-- Right Collars & Plates -->
    <rect x="370" y="210" width="22" height="92" rx="8" fill="#FFFFFF" />
    <rect x="398" y="130" width="38" height="252" rx="14" fill="#FFFFFF" />
    <rect x="446" y="166" width="34" height="180" rx="12" fill="#EDEDED" />
  </g>
</svg>